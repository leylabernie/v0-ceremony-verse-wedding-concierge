name: CeremonyVerse internal-link intent refinement

on:
  push:
    branches:
      - agent/mailbox-verification-20260813

permissions:
  contents: write

jobs:
  refine-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out focused cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/internal-link-cleanup-20260813
          fetch-depth: 0

      - name: Route sourcing links to the sourcing service
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          planning = "/indian-destination-wedding-planner-mexico/"
          sourcing = "/buy-indian-wedding-outfits-from-india/"
          expected_counts = {
              "app/blog/gujarati-wedding-outfit-guide/page.tsx": 2,
              "app/blog/how-to-buy-bridal-lehenga-from-india-usa/page.tsx": 2,
              "app/blog/how-to-buy-sherwani-from-india-usa/page.tsx": 2,
              "app/blog/indian-wedding-outfit-checklist-every-ceremony/page.tsx": 1,
              "app/blog/indian-wedding-outfit-scams-nri-brides/page.tsx": 1,
              "app/blog/shipping-indian-wedding-outfits-usa-customs-duties/page.tsx": 1,
              "app/blog/us-tariffs-indian-wedding-outfits-2026/page.tsx": 2,
          }

          for filename, expected in expected_counts.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              marker = f'href="{planning}"'
              actual = text.count(marker)
              if actual != expected:
                  raise SystemExit(
                      f"Unexpected planning-link count in {filename}: expected {expected}, found {actual}"
                  )
              path.write_text(text.replace(marker, f'href="{sourcing}"'), encoding="utf-8")

          extensions = {".ts", ".tsx", ".js", ".jsx", ".mjs", ".md", ".mdx"}
          forbidden = (
              'href="/indian-wedding-coordination-mexico/"',
              "href='/indian-wedding-coordination-mexico/'",
              'href: "/indian-wedding-coordination-mexico/"',
              "href: '/indian-wedding-coordination-mexico/'",
              'href="/services/"',
              "href='/services/'",
              'href: "/services/"',
              "href: '/services/'",
          )
          remaining = []
          for path in sorted(Path(".").rglob("*")):
              if not path.is_file() or path.suffix not in extensions:
                  continue
              if any(part in {"node_modules", ".next", ".git"} for part in path.parts):
                  continue
              text = path.read_text(encoding="utf-8")
              for marker in forbidden:
                  if marker in text:
                      remaining.append(f"{path}: {marker}")

          if remaining:
              raise SystemExit("Residual redirecting links remain:\n" + "\n".join(remaining))

          print("SERVICE_INTENT_LINKS=PASS")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm --version

      - name: Install and build
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Publish refined tested commit
        shell: bash
        run: |
          git config user.name "leylabernie"
          git config user.email "bhamini@verizon.net"
          git add -A
          git commit -m "Route internal links by service intent"
          git push origin HEAD:agent/internal-link-cleanup-20260813
